version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - bot:dependencies
      - bot:github-actions

  - package-ecosystem: npm
    directory: /
    registries: "*"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - bot:dependencies

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - bot:dependencies

registries:
  github:
    type: git
    url: https://github.com
    username: MidnightCI
    password: ${{ secrets.MIDNIGHTCI_REPO }}
