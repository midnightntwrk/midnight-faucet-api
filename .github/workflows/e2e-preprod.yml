name: Faucet E2E Test - preprod

on:
  workflow_dispatch:
  schedule:
    # Runs daily
    - cron: "0 5 * * *"

permissions: {}

jobs:
  test:
    name: Faucet E2E Test
    permissions:
      id-token: write
      contents: read
      packages: write
      checks: write
      pull-requests: write
    uses: ./.github/workflows/e2e-test.yml
    with:
      network: preprod
      # Pinned: main moved ahead of the deployed envs (wallet-sdk/ledger v9 bump, #581/#583),
      # causing "Could not deserialize Ledger Event". fb7c345 is the last commit compatible
      # with the preprod/preview/qanet deployments. Revert to main once envs are upgraded.
      branch: fb7c345e127ddf1dd84723b84a4029b5797fab36
    secrets: inherit
