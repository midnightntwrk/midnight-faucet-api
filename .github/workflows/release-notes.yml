name: Generate Release Notes

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (e.g., Preprod, Preview)"
        required: false
        default: "Preprod, Preview"

permissions: {}

jobs:
  generate-release-notes:
    name: Generate and update release notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        # No `cache:` input, so setup-node performs no caching here.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: ".nvmrc"

      - name: Generate release notes
        env:
          RELEASE_ENV: ${{ inputs.environment || 'Preprod, Preview' }}
        run: |
          node scripts/generate-release-notes.mjs --env "$RELEASE_ENV"
      - name: Update GitHub Release with generated notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$TAG_NAME" \
            --notes-file RELEASE_NOTES.md \
            --prerelease="$PRERELEASE"

      - name: Commit release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RELEASE_NOTES.md
          git commit -m "docs: update release notes for ${TAG_NAME}"
          git push origin HEAD:main

      - name: Upload release notes artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
