name: Generate Release Notes

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (e.g., Preprod, Preview)"
        required: false
        default: "Preprod, Preview"

permissions: {}

jobs:
  generate-release-notes:
    name: Generate and update release notes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # The generator reads PR titles, bodies and labels to source and classify changes;
      # write is needed to open the PR that lands RELEASE_NOTES.md.
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        # No `cache:` input, so setup-node performs no caching here.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: ".nvmrc"

      # Exits non-zero when the note still has unanswered owner fields, which fails the job and so
      # skips the publish steps below — the release body is left untouched until the gaps are filled.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENV: ${{ inputs.environment || 'Preprod, Preview' }}
        run: |
          node scripts/generate-release-notes.mjs --env "$RELEASE_ENV"

      - name: Update GitHub Release with generated notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$TAG_NAME" \
            --notes-file RELEASE_NOTES.md \
            --prerelease="$PRERELEASE"

      # main rejects direct pushes — it requires a pull request, signed commits and
      # passing checks — so the previous `git push origin HEAD:main` could only ever
      # fail, and did so *after* `gh release edit` had already published the notes.
      - name: Open a PR with the release notes
        if: github.event_name == 'release'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          # A PR opened with the job's own GITHUB_TOKEN does not trigger workflows, so
          # its required checks would never start and it could never merge.
          token: ${{ secrets.MIDNIGHTCI_REPO }}
          add-paths: RELEASE_NOTES.md
          commit-message: "docs: update release notes for ${{ github.event.release.tag_name }}"
          title: "docs: release notes for ${{ github.event.release.tag_name }}"
          body: |
            Generated by the "Generate Release Notes" workflow for
            ${{ github.event.release.tag_name }}. The GitHub Release body has already been
            updated; this PR only lands `RELEASE_NOTES.md` on `main`.
          branch: docs/release-notes-${{ github.event.release.tag_name }}
          delete-branch: true
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Upload release notes artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: RELEASE_NOTES.md
