name: Generate Release Notes

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (e.g., Preprod, Preview)"
        required: false
        default: "Preprod, Preview"

permissions: {}

jobs:
  generate-release-notes:
    name: Generate and update release notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The generator reads PR titles, bodies and labels to source and classify changes.
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        # No `cache:` input, so setup-node performs no caching here.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: ".nvmrc"

      # Exits non-zero when the note still has unanswered owner fields, which fails the job and so
      # skips the publish steps below — the release body is left untouched until the gaps are filled.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENV: ${{ inputs.environment || 'Preprod, Preview' }}
        run: |
          node scripts/generate-release-notes.mjs --env "$RELEASE_ENV"

      - name: Update GitHub Release with generated notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$TAG_NAME" \
            --notes-file RELEASE_NOTES.md \
            --prerelease="$PRERELEASE"

      - name: Commit release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RELEASE_NOTES.md
          git commit -m "docs: update release notes for ${TAG_NAME}"
          git push origin HEAD:main

      - name: Upload release notes artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: RELEASE_NOTES.md
