name: Faucet E2E Test - qanet

on:
  workflow_dispatch:
  schedule:
    # Runs daily
    - cron: '0 5 * * *'

permissions: {}

jobs:
  test:
    name: Faucet E2E Test
    permissions:
      id-token: write
      contents: read
      packages: write
      checks: write
      pull-requests: write
    uses: ./.github/workflows/e2e-test.yml
    with:
      network: qanet
    secrets: inherit
    