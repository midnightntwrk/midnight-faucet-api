name: Faucet Load Test

permissions: {}

on:
  workflow_dispatch:
    inputs:
      network:
        type: choice
        description: Midnight network to use
        required: true
        default: "preprod"
        options:
          - preview
          - preprod
      numberOfUsers:
        required: true
        default: "1"
      warmupRuns:
        required: true
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # This is required for actions/checkout
      packages: read # This is required for using GH docker registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace
        with:
          packages-read-token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
          midnight-scope: "true"
          ghcr-login: "true"

      - name: Build
        run: yarn build

      - name: Run Load Test
        env:
          NETWORK: ${{ inputs.network }}
          NUMBER_OF_USERS: ${{ inputs.numberOfUsers }}
          WARMUP_RUNS: ${{ inputs.warmupRuns }}
        run: |
          ./tests/src/load/loadTest.mjs
