name: Faucet Load Test

permissions: {}

on:
  workflow_dispatch:
    inputs:
      network:
        type: choice
        description: Midnight network to use
        required: true
        default: "qanet"
        options:
          - qanet
          - preview
          - preprod
          - stagenet
      numberOfUsers:
        required: true
        default: "1"
      warmupRuns:
        required: true
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout
      packages: read # This is required for using GH docker registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          always-auth: true
          registry-url: https://npm.pkg.github.com/
          scope: "@midnight-ntwrk"
          node-version-file: ".nvmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Log in to GitHub Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: "https://ghcr.io"
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Configure yarn
        env:
          GH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
        run: |
          yarn config set 'npmScopes.midnight-ntwrk.npmAuthToken' "$GH_TOKEN"

      - name: Dependencies cache restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ./.yarn/cache
            ./node_modules
          key: yarn-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            yarn-${{ github.ref_name }}
            yarn-main

      - name: Install dependencies
        run: |
          yarn install --immutable
          yarn build

      - name: Run Load Test
        env:
          NETWORK: ${{ inputs.network }}
          NUMBER_OF_USERS: ${{ inputs.numberOfUsers }}
          WARMUP_RUNS: ${{ inputs.warmupRuns }}
        run: |
          ./tests/src/load/loadTest.mjs
