name: Scan
permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # so you can still run it manually
  schedule:
    - cron: "0 0 * * *" # run daily at midnight UTC
concurrency:
  group: ${{ github.event_name != 'merge_group' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan code
        id: scan
        # The shared scanner includes trivy vulnerability scanning. This pin
        # also includes the caller-workspace fix; older revisions scanned the
        # action checkout itself and reported its dependencies.
        uses: midnightntwrk/upload-sarif-github-action@6e93ae0ea1494d29b521a2c8bbfa068375bf7a26
        with:
          fail_severity: "high"
          # The absolute gate blocks every PR while any finding is outstanding,
          # including the PRs that fix them one at a time. A fix can also be
          # unavailable: npmMinimalAgeGate quarantines a patch for 7 days, so a
          # fresh advisory is unfixable here for a week. Pass PRs that strictly
          # reduce the count; unrelated PRs stay blocked.
          differential_gate: "true"
          # Checks supported by Scorecard's local mode; unset means all checks,
          # and locally-unsupported ones score -1, which the gate reads as high.
          scorecard_checks: Binary-Artifacts,Dangerous-Workflow,Dependency-Update-Tool,License,Pinned-Dependencies,Security-Policy,Token-Permissions,Vulnerabilities
