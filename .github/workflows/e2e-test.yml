      #   if: ${{ failure() && inputs.network == 'testnet' && steps.tests.outcome == 'failure' }}
      #   env:
      #     SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      #     SLACK_CHANNEL: topic-incident-management
      #     SLACK_COLOR: ${{ job.status }} # or a specific color like 'good' or '#ff00ff'
      #     SLACK_MESSAGE: 'Testnet run failed :x:'
      #     SLACK_TITLE: Faucet E2E tests
