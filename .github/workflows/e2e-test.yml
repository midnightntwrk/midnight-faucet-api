name: Faucet E2E Test

env:
  DISPLAY: ":99.0"
  SYNC_CACHE: ${{ github.workspace }}/tests/src/e2e/.sync_cache

permissions: {}

on:
  workflow_dispatch:
    inputs:
      network:
        type: choice
        description: Midnight network to use
        required: true
        default: "qanet"
        options:
          - qanet
          - preprod
          - preview
          - stagenet
          - undeployed
      deployment:
        type: choice
        description: Midnight deployment to use
        required: false
        default: "preprod"
        options:
          - local
          - qanet
          - preview
          - preprod
      modifier:
        type: string
        description: Suite or a testname to run
        required: false
      branch:
        type: string
        description: Branch to run the tests against
        required: false
        default: "main"
  workflow_call:
    inputs:
      network:
        type: string
        description: Midnight network to use (qanet/preview/preprod/undeployed)
        required: false
        default: "preprod"
      deployment:
        type: string
        description: Midnight deployment to use (qanet/preview/preprod/local)
        required: false
        default: "preprod"
      modifier:
        type: string
        description: Suite or a testname to run
        required: false
      branch:
        type: string
        description: Branch to run the tests against
        required: false
        default: "main"
    secrets:
      MIDNIGHTCI_PACKAGES_READ:
        required: true
      TURNSTILE_HEADER:
        required: true
      VISITOR_PASSWORD:
        required: true

jobs:
  build:
    name: Faucet E2E Test
    runs-on: ubuntu-latest-8-core-x64
    permissions:
      contents: read # This is required for actions/checkout
      packages: read # This is required for using GH docker registry
      checks: write # This is needed to upload test results
      pull-requests: write # This is needed to upload test results

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      # - name: Determine the latest run ID with appropriate artifact
      #   continue-on-error: true
      #   env:
      #     GH_TOKEN: ${{ secrets.GH_TOKEN }}
      #   run: |
      #       LATEST_RUN_ID=$(./.github/scripts/find_run_id.sh ${{ github.repository }} "Faucet E2E Test - ${{ inputs.network }}" ".sync_cache")
      #       echo "LATEST_RUN_ID=$LATEST_RUN_ID" >> $GITHUB_ENV
      #       mkdir -p ${{ env.SYNC_CACHE }}

      # - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      #   continue-on-error: true
      #   with:
      #     run-id: ${{ env.LATEST_RUN_ID }}
      #     path: ${{ env.SYNC_CACHE }}
      #     github-token: ${{ secrets.GH_TOKEN }}
      #     name: .sync_cache

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          always-auth: true
          registry-url: https://npm.pkg.github.com/
          scope: "@midnight-ntwrk"
          node-version-file: ".nvmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable Corepack
        run: corepack enable

      - name: Log in to GitHub Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: "https://ghcr.io"
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Configure yarn
        env:
          GH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
        run: |
          # The @midnight-ntwrk scope's deps span two registries: most are pinned to
          # GitHub Packages archiveUrls in the lockfile, but three v8-stack deps
          # (wallet-sdk-abstractions, wallet-sdk-hd, zkir-v2) are only on public npm and
          # carry no archiveUrl. Point the scope at public npm so those three resolve.
          # yarn ties download auth to the *scope* registry (not the archiveUrl host), so
          # keep the token on the scope; with npmAlwaysAuth off it is sent only when a host
          # returns 401 (GitHub Packages, via the archiveUrls) and never to public npm.
          yarn config set 'npmScopes.midnight-ntwrk.npmRegistryServer' 'https://registry.npmjs.org'
          yarn config set 'npmScopes.midnight-ntwrk.npmAlwaysAuth' false
          yarn config set 'npmScopes.midnight-ntwrk.npmAuthToken' "$GH_TOKEN"

      - name: Install Playwright
        working-directory: ./tests
        run: |
          yarn install --immutable
          yarn playwright install --with-deps

      - name: Log in to GitHub Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: "https://ghcr.io"
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Start XVFB
        run: |
          Xvfb :99 &

      - name: Run E2E tests
        id: tests
        env:
          NETWORK: ${{ inputs.network }}
          DEPLOYMENT: ${{ inputs.deployment }}
          TURNSTILE_HEADER: ${{ secrets.TURNSTILE_HEADER }}
          VISITOR_PASSWORD: ${{ secrets.VISITOR_PASSWORD }}
        run: |
          cd tests
          yarn e2e-test

      - name: Upload sync cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: .sync_cache
          path: ${{ env.SYNC_CACHE }}
          include-hidden-files: true

      - name: Publish test report
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        if: success() || failure()
        with:
          name: "E2E Test Results - ${{ inputs.network }}"
          path: ./tests/src/e2e/reports/junit-results.xml
          reporter: java-junit
          fail-on-empty: "false"

      - name: Publish artifacts (test reports)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: test-reports
          path: |
            ./tests/src/e2e/reports/playwright-report
            ./tests/src/e2e/reports/playwrightResults
          retention-days: 30

