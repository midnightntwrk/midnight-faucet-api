name: Faucet E2E Test

env:
  DISPLAY: ":99.0"
  SYNC_CACHE: ${{ github.workspace }}/tests/src/e2e/.sync_cache

permissions: {}

on:
  workflow_dispatch:
    inputs:
      network:
        type: choice
        description: Midnight network to use
        required: true
        default: "preprod"
        options:
          - preprod
          - preview
      modifier:
        type: string
        description: Extra Playwright args, e.g. -g "dispense"
        required: false
      branch:
        type: string
        description: Branch to run the tests against
        required: false
        default: "main"
  workflow_call:
    inputs:
      network:
        type: string
        description: Midnight network to use (preview/preprod)
        required: false
        default: "preprod"
      modifier:
        type: string
        description: Extra Playwright args, e.g. -g "dispense"
        required: false
      branch:
        type: string
        description: Branch to run the tests against
        required: false
        default: "main"
    secrets:
      MIDNIGHTCI_PACKAGES_READ:
        required: true
      TURNSTILE_HEADER:
        required: true
      VISITOR_PASSWORD:
        required: true

jobs:
  build:
    name: Faucet E2E Test
    runs-on: ubuntu-latest-8-core-x64
    timeout-minutes: 90
    permissions:
      contents: read # This is required for actions/checkout
      packages: read # This is required for using GH docker registry
      checks: write # This is needed to upload test results

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace
        with:
          packages-read-token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
          midnight-scope: "true"
          ghcr-login: "true"
          install: "false"

      - name: Install dependencies
        working-directory: ./tests
        run: yarn install --immutable

      - name: Resolve Playwright version
        id: playwright
        working-directory: ./tests
        run: echo "version=$(yarn playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Browsers are ~400MB and otherwise re-downloaded on every run. Keyed on the
      # resolved Playwright version, since browser builds are pinned per release.
      - name: Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        working-directory: ./tests
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            # The browsers are cached but their OS-level shared libraries are not.
            yarn playwright install-deps
          else
            yarn playwright install --with-deps
          fi

      - name: Start XVFB
        run: Xvfb :99 &

      - name: Run E2E tests
        id: tests
        working-directory: ./tests
        env:
          NETWORK: ${{ inputs.network }}
          TURNSTILE_HEADER: ${{ secrets.TURNSTILE_HEADER }}
          VISITOR_PASSWORD: ${{ secrets.VISITOR_PASSWORD }}
          MODIFIER: ${{ inputs.modifier }}
        run: |
          # shellcheck disable=SC2086 # MODIFIER is a caller-supplied argument list
          yarn e2e-test ${MODIFIER}

      - name: Upload sync cache
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: .sync_cache
          path: ${{ env.SYNC_CACHE }}
          include-hidden-files: true

      - name: Publish test report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: success() || failure()
        with:
          name: "E2E Test Results - ${{ inputs.network }}"
          path: ./tests/src/e2e/reports/junit-results.xml
          reporter: java-junit
          fail-on-empty: "false"

      - name: Publish artifacts (test reports)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: test-reports
          path: |
            ./tests/src/e2e/reports/playwright-report
            ./tests/src/e2e/reports/playwrightResults
          retention-days: 30
