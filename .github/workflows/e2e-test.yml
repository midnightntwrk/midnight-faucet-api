name: Faucet E2E Test

env:
  DISPLAY: ":99.0"
  SYNC_CACHE: ${{ github.workspace }}/tests/src/e2e/.sync_cache

permissions: {}

on:
  workflow_dispatch:
    inputs:
      network:
        type: choice
        description: Midnight network to use
        required: true
        default: "preprod"
        options:
          - preprod
          - preview
      modifier:
        type: string
        description: Suite or a testname to run
        required: false
      branch:
        type: string
        description: Branch to run the tests against
        required: false
        default: "main"
  workflow_call:
    inputs:
      network:
        type: string
        description: Midnight network to use (preview/preprod)
        required: false
        default: "preprod"
      modifier:
        type: string
        description: Suite or a testname to run
        required: false
      branch:
        type: string
        description: Branch to run the tests against
        required: false
        default: "main"
    secrets:
      MIDNIGHTCI_PACKAGES_READ:
        required: true
      TURNSTILE_HEADER:
        required: true
      VISITOR_PASSWORD:
        required: true

jobs:
  build:
    name: Faucet E2E Test
    runs-on: ubuntu-latest-8-core-x64
    permissions:
      contents: read # This is required for actions/checkout
      packages: read # This is required for using GH docker registry
      checks: write # This is needed to upload test results
      pull-requests: write # This is needed to upload test results

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      # - name: Determine the latest run ID with appropriate artifact
      #   continue-on-error: true
      #   env:
      #     GH_TOKEN: ${{ secrets.GH_TOKEN }}
      #   run: |
      #       LATEST_RUN_ID=$(./.github/scripts/find_run_id.sh ${{ github.repository }} "Faucet E2E Test - ${{ inputs.network }}" ".sync_cache")
      #       echo "LATEST_RUN_ID=$LATEST_RUN_ID" >> $GITHUB_ENV
      #       mkdir -p ${{ env.SYNC_CACHE }}

      # - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      #   continue-on-error: true
      #   with:
      #     run-id: ${{ env.LATEST_RUN_ID }}
      #     path: ${{ env.SYNC_CACHE }}
      #     github-token: ${{ secrets.GH_TOKEN }}
      #     name: .sync_cache

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          always-auth: true
          registry-url: https://npm.pkg.github.com/
          scope: "@midnight-ntwrk"
          node-version-file: ".nvmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable Corepack
        run: corepack enable

      - name: Log in to GitHub Container registry
        uses: docker/login-action@d0b8297dd55199249f38268efae35fcb03f75aab
        with:
          registry: "https://ghcr.io"
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Install Playwright
        working-directory: ./tests
        run: |
          yarn install --immutable
          yarn playwright install --with-deps

      - name: Log in to GitHub Container registry
        uses: docker/login-action@d0b8297dd55199249f38268efae35fcb03f75aab
        with:
          registry: "https://ghcr.io"
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Start XVFB
        run: |
          Xvfb :99 &

      - name: Run E2E tests
        id: tests
        env:
          NETWORK: ${{ inputs.network }}
          TURNSTILE_HEADER: ${{ secrets.TURNSTILE_HEADER }}
          VISITOR_PASSWORD: ${{ secrets.VISITOR_PASSWORD }}
        run: |
          cd tests
          yarn e2e-test

      - name: Upload sync cache
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: .sync_cache
          path: ${{ env.SYNC_CACHE }}
          include-hidden-files: true

      - name: Publish test report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: success() || failure()
        with:
          name: "E2E Test Results - ${{ inputs.network }}"
          path: ./tests/src/e2e/reports/junit-results.xml
          reporter: java-junit
          fail-on-empty: "false"

      - name: Publish artifacts (test reports)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: test-reports
          path: |
            ./tests/src/e2e/reports/playwright-report
            ./tests/src/e2e/reports/playwrightResults
          retention-days: 30

      # - uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2
      #   if: ${{ failure() && inputs.network == 'testnet' && steps.tests.outcome == 'failure' }}
      #   env:
      #     SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      #     SLACK_CHANNEL: topic-incident-management
      #     SLACK_COLOR: ${{ job.status }} # or a specific color like 'good' or '#ff00ff'
      #     SLACK_MESSAGE: 'Testnet run failed :x:'
      #     SLACK_TITLE: Faucet E2E tests
