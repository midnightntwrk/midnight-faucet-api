name: Faucet Smoke Test - preview

on:
  workflow_dispatch:
  schedule:
    # Runs twice a day
    - cron: "0 0,6,12,16 * * *"

permissions: {}

jobs:
  test:
    name: Faucet Smoke Test
    permissions:
      id-token: write
      contents: read
      packages: write
      checks: write
      pull-requests: write
    uses: ./.github/workflows/smoke-test.yml
    with:
      network: preview
      # Pinned: the deployed preprod/preview/qanet envs run the ledger v8 stack, but main
      # moved to ledger v9 (#574 onward), which breaks wallet sync against these envs.
      # f27b171 is the last commit on the v8 stack (@midnight-ntwrk/ledger-v8). Revert to
      # main once the environments are upgraded to ledger v9.
      branch: f27b17138c42a9f931f31b1ad04b240705007137
    secrets: inherit
