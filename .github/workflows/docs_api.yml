name: Publish updated API documentation

on:
  workflow_dispatch:

permissions: {}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the docs branch
      pull-requests: write # open the docs PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Turbo cache restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./turbo_cache
          key: turbo-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            turbo-${{ github.ref_name }}
            turbo-main

      - name: Generate documentation
        run: |
          yarn build --cache-dir ./turbo_cache
          yarn build:markdown-docs

      - name: Turbo cache save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: ./turbo_cache
          key: turbo-${{ github.ref_name }}-${{ github.run_id }}

      # Was a hand-rolled branch-and-push plus a third-party commit action on a personal
      # account, both driven by the org-wide MIDNIGHTCI_REPO PAT. The same action already
      # used by update-docker-images.yml does the whole thing with the job's own
      # GITHUB_TOKEN, scoped to this repository.
      - name: Open a docs PR
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          # A PR opened with the job's own GITHUB_TOKEN does not trigger workflows, so
          # its required checks would never start and it could never merge. That is the
          # only reason this still needs the PAT.
          token: ${{ secrets.MIDNIGHTCI_REPO }}
          add-paths: docs
          commit-message: "docs: update generated API documentation"
          title: "API documentation update"
          body: |
            Regenerated API documentation, created by the "Publish updated API documentation"
            workflow. Produced by `yarn build:markdown-docs`; review the diff rather than
            editing these files by hand.
          branch: docs/api-update
          delete-branch: true
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
