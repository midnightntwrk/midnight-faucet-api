name: Faucet Smoke Test

env:
  SYNC_CACHE: ${{ github.workspace }}/tests/src/smoke/.sync_cache

permissions: {}

on:
  workflow_dispatch:
    inputs:
      network:
        type: choice
        description: Midnight network to use
        required: true
        default: "preview"
        options:
          - preview
          - qanet
          - preprod
          - stagenet
          - undeployed
      modifier:
        type: string
        description: Suite or a testname to run
        required: false
      branch:
        type: string
        description: Branch to run the tests against
        required: false
        default: "main"
  workflow_call:
    inputs:
      network:
        type: string
        description: Midnight network to use (preview/qanet/preprod/undeployed)
        required: false
        default: "preview"
      modifier:
        type: string
        description: Suite or a testname to run
        required: false
      branch:
        type: string
        description: Branch to run the tests against
        required: false
        default: "main"
    secrets:
      MIDNIGHTCI_PACKAGES_READ:
        required: true
      TURNSTILE_HEADER:
        required: true
      THIRD_PARTY_API_KEY:
        required: true

jobs:
  build:
    name: Faucet Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read # This is required for actions/checkout
      packages: read # This is required for using GH docker registry
      checks: write # This is needed to upload test results
      pull-requests: write # This is needed to upload test results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      # - name: Determine the latest run ID with appropriate artifact
      #   continue-on-error: true
      #   env:
      #     GH_TOKEN: ${{ secrets.GH_TOKEN }}
      #   run: |
      #       LATEST_RUN_ID=$(./.github/scripts/find_run_id.sh ${{ github.repository }} "Faucet Smoke Test - ${{ inputs.network }}" ".sync_cache")
      #       echo "LATEST_RUN_ID=$LATEST_RUN_ID" >> $GITHUB_ENV
      #       mkdir -p ${{ env.SYNC_CACHE }}

      # - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      #   continue-on-error: true
      #   with:
      #     run-id: ${{ env.LATEST_RUN_ID }}
      #     path: ${{ env.SYNC_CACHE }}
      #     github-token: ${{ secrets.GH_TOKEN }}
      #     name: .sync_cache

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          always-auth: true
          registry-url: https://npm.pkg.github.com/
          scope: "@midnight-ntwrk"
          node-version-file: ".nvmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable Corepack
        run: corepack enable

      - name: Log in to GitHub Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: "https://ghcr.io"
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Configure yarn
        env:
          GH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
        run: |
          # The @midnight-ntwrk scope's deps span two registries: most are pinned to
          # GitHub Packages archiveUrls in the lockfile, but three v8-stack deps
          # (wallet-sdk-abstractions, wallet-sdk-hd, zkir-v2) are only on public npm and
          # carry no archiveUrl. Point the scope at public npm so those three resolve.
          # yarn ties download auth to the *scope* registry (not the archiveUrl host), so
          # keep the token on the scope; with npmAlwaysAuth off it is sent only when a host
          # returns 401 (GitHub Packages, via the archiveUrls) and never to public npm.
          yarn config set 'npmScopes.midnight-ntwrk.npmRegistryServer' 'https://registry.npmjs.org'
          yarn config set 'npmScopes.midnight-ntwrk.npmAlwaysAuth' false
          yarn config set 'npmScopes.midnight-ntwrk.npmAuthToken' "$GH_TOKEN"

      - name: Dependencies cache restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ./.yarn/cache
            ./node_modules
          key: yarn-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            yarn-${{ github.ref_name }}
            yarn-main

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Run smoke test
        env:
          NETWORK: ${{ inputs.network }}
          SYNC_CACHE: ${{ env.SYNC_CACHE }}
          TURNSTILE_HEADER: ${{ secrets.TURNSTILE_HEADER }}
          THIRD_PARTY_API_KEY: ${{ secrets.THIRD_PARTY_API_KEY }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          cd tests
          yarn smoke-test

      - name: Upload sync cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: .sync_cache
          path: ${{ env.SYNC_CACHE }}
          include-hidden-files: true

      - name: Publish Faucet Smoke Tests Report
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        if: success() || failure()
        with:
          name: Faucet Smoke Tests Report
          reporter: java-junit
          path: ./tests/reports/report/test-report.xml

      - name: Publish Faucet Smoke Tests Summary
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        if: success() || failure()
        with:
          check_name: Faucet Smoke Tests Summary
          files: ./tests/reports/report/test-report.xml
