name: Faucet Smoke Test

env:
  SYNC_CACHE: ${{ github.workspace }}/tests/src/smoke/.sync_cache

permissions: {}

on:
  workflow_dispatch:
    inputs:
      network:
        type: choice
        description: Midnight network to use
        required: true
        default: "preview"
        options:
          - preview
          - preprod
          - undeployed
      modifier:
        type: string
        description: Vitest filter — a test file name or path fragment
        required: false
      branch:
        type: string
        description: Branch to run the tests against
        required: false
        default: "main"
  workflow_call:
    inputs:
      network:
        type: string
        description: Midnight network to use (preview/preprod/undeployed)
        required: false
        default: "preview"
      modifier:
        type: string
        description: Vitest filter — a test file name or path fragment
        required: false
      branch:
        type: string
        description: Branch to run the tests against
        required: false
        default: "main"
    secrets:
      MIDNIGHTCI_PACKAGES_READ:
        required: true
      TURNSTILE_HEADER:
        required: true
      THIRD_PARTY_API_KEY:
        required: true

jobs:
  build:
    name: Faucet Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read # This is required for actions/checkout
      packages: read # This is required for using GH docker registry
      checks: write # This is needed to upload test results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace
        with:
          packages-read-token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
          midnight-scope: "true"
          ghcr-login: "true"

      - name: Run smoke test
        working-directory: ./tests
        env:
          NETWORK: ${{ inputs.network }}
          SYNC_CACHE: ${{ env.SYNC_CACHE }}
          TURNSTILE_HEADER: ${{ secrets.TURNSTILE_HEADER }}
          THIRD_PARTY_API_KEY: ${{ secrets.THIRD_PARTY_API_KEY }}
          NODE_OPTIONS: --max-old-space-size=8192
          MODIFIER: ${{ inputs.modifier }}
        run: |
          # shellcheck disable=SC2086 # MODIFIER is a caller-supplied argument list
          yarn smoke-test ${MODIFIER}

      - name: Upload sync cache
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: .sync_cache
          path: ${{ env.SYNC_CACHE }}
          include-hidden-files: true

      # These run against deployed networks on a schedule, so the JUnit XML is the only
      # durable record of what actually executed. A run that produced no results has
      # failed, and must not be reported as a pass.
      - name: Publish Faucet Smoke Tests Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: success() || failure()
        with:
          name: "Faucet Smoke Tests Report - ${{ inputs.network }}"
          reporter: java-junit
          path: ./tests/reports/report/test-report.xml

      - name: Publish Faucet Smoke Tests Summary
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2
        if: success() || failure()
        with:
          check_name: "Faucet Smoke Tests Summary - ${{ inputs.network }}"
          files: ./tests/reports/report/test-report.xml
          action_fail_on_inconclusive: true
