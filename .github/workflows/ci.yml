name: CI

on:
  workflow_call:
    secrets:
      MIDNIGHTCI_PACKAGES_READ:
        required: true
  workflow_dispatch:
  push:
  schedule:
    - cron: "2 0 * * *"

permissions: {}

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest-8-core-x64
    permissions:
      contents: read # This is required for actions/checkout
      packages: read # This is required for using GH docker registry
      checks: write # This is needed to upload test results
      pull-requests: write # This is needed to upload test results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          always-auth: true
          registry-url: https://npm.pkg.github.com/
          scope: "@midnight-ntwrk"
          node-version-file: ".nvmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable Corepack
        run: corepack enable

      - name: Log in to GitHub Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: "https://ghcr.io"
          username: ntwrk-bot
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Configure yarn
        run: |
          yarn config set 'npmScopes.midnight-ntwrk.npmAuthToken' "${{ secrets.MIDNIGHTCI_PACKAGES_READ }}"

      - name: Dependencies cache restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ./.yarn/cache
            ./node_modules
          key: yarn-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            yarn-${{ github.ref_name }}
            yarn-main

      - name: Install dependencies
        run: "yarn install --immutable"

      - name: Dependencies cache save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: |
            ./.yarn/cache
            ./node_modules
          key: yarn-${{ github.ref_name }}-${{ github.run_id }}

      - name: Turbo cache restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./turbo_cache
          key: turbo-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            turbo-${{ github.ref_name }}
            turbo-main

      - name: Generate test-only secrets
        run: |
          encryption_key=$(openssl rand -hex 32)
          jwt_sign_secret=$(openssl rand -hex 32)
          echo "::add-mask::$encryption_key"
          echo "::add-mask::$jwt_sign_secret"
          {
            echo "ENCRYPTION_KEY=$encryption_key"
            echo "JWT_SIGN_SECRET=$jwt_sign_secret"
          } >> "$GITHUB_ENV"

      - name: Verify test secret env vars
        run: |
          echo "ENCRYPTION_KEY length: ${#ENCRYPTION_KEY}"
          echo "JWT_SIGN_SECRET length: ${#JWT_SIGN_SECRET}"
          if [ -z "$ENCRYPTION_KEY" ] || [ -z "$JWT_SIGN_SECRET" ]; then
            echo "::error::Missing required ENCRYPTION_KEY or JWT_SIGN_SECRET secrets"
            exit 1
          fi

      - name: Run checks
        run: |
          npx turbo check --cache-dir ./turbo_cache --concurrency 1

      - name: Turbo cache save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: ./turbo_cache
          key: turbo-${{ github.ref_name }}-${{ github.run_id }}

      - name: Publish Test Report
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        if: success() || failure()
        with:
          name: Vitest Tests Report
          path: packages/**/reports/report/test-report.xml,apps/**/reports/report/test-report.xml,tests/**/reports/report/test-report.xml
          reporter: java-junit

      - name: Publish Test Summary
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        if: success() || failure()
        with:
          check_name: Vitest Tests Results
          files: |
            ./packages/**/reports/report/test-report.xml
            ./apps/**/reports/report/test-report.xml
            ./tests/**/reports/report/test-report.xml

      - name: Aggregate coverage reports
        run: |
          mkdir -p coverage/workspaces
          # The command is interpreted by each workspace shell; expansion in
          # this outer shell would copy from the wrong directory.
          # shellcheck disable=SC2016,SC2046
          yarn workspaces foreach -Apv exec bash -c '[ ! -f coverage/coverage-final.json ] && exit 0 || cp coverage/coverage-final.json '$(pwd)'/coverage/workspaces/$(basename $(pwd))-coverage-final.json'

      - name: Merge report as ZIP
        run: mv coverage "coverage_$(date +"%Y%m%d%H%M%S")"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage*
