name: Scan
permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # so you can still run it manually
  schedule:
    - cron: "0 0 * * *" # run daily at midnight UTC
concurrency:
  group: ${{ github.event_name != 'merge_group' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Scan code
        id: scan
        # This pin includes the caller-workspace fix: older revisions scanned
        # the action checkout itself, producing findings for its dependencies.
        uses: midnightntwrk/upload-sarif-github-action@0ec83cec2d2703f682c85392b19e3f8db7e85434
        with:
          fail_severity: "high"
          # Checks supported by Scorecard's local mode; unset means all checks,
          # and locally-unsupported ones score -1, which the gate reads as high.
          scorecard_checks: Binary-Artifacts,Dangerous-Workflow,Dependency-Update-Tool,License,Pinned-Dependencies,Security-Policy,Token-Permissions,Vulnerabilities
