name: Bug report
description: Report incorrect or unexpected faucet behavior.
title: "bug: "
labels: ["status:untriaged", "component:faucet"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not use this form for security vulnerabilities; follow SECURITY.md instead.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which version, tag, or commit are you running?
      placeholder: "v0.14.0 or commit SHA"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Engineering urgency; maintainers may adjust this during triage.
      options:
        - P3 - Medium
        - P2 - High
        - P1 - Critical
        - P0 - Blocking
        - P4 - Low
      default: 0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version, network, and relevant configuration.
      placeholder: "macOS 15, Node 24.11.1, preview"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `...`
        2. Observe `...`
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant logs or screenshots after removing secrets.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
