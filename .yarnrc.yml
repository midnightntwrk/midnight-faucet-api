changesetIgnorePatterns:
  - .yarn/**/*

compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

# Reduce exposure to newly published package compromises while preserving
# explicitly locked dependencies and deliberate upgrades.
npmMinimalAgeGate: "7d"

npmPublishRegistry: "https://registry.npmjs.org"

npmRegistries:
  "https://registry.npmjs.org":
    npmAuthToken: "${NPM_TOKEN:-}"

# Our own packages are @midnightntwrk on public npm and need no entry here. This scope
# is still required for @midnight-ntwrk/zkir-v2, a transitive dep of the wallet SDK that
# the lockfile pins to a GitHub Packages archiveUrl. Yarn ties download auth to the scope
# registry rather than the archiveUrl host, so dropping the token 401s a cold install.
npmScopes:
  midnight-ntwrk:
    npmAlwaysAuth: true
    npmRegistryServer: "https://npm.pkg.github.com"
    npmAuthToken: "${GH_TOKEN:-${GITHUB_TOKEN:-${NODE_AUTH_TOKEN:-}}}"
