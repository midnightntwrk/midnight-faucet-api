services:
  proof-server:
    image: "ghcr.io/midnight-ntwrk/proof-server:9.0.0-rc.3"
    container_name: proof-server_$TESTCONTAINERS_UID
    security_opt:
      - no-new-privileges:true
    ports:
      - "6300"
    environment:
      RUST_BACKTRACE: "full"
      EXTRA_ARGS: -v
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6300/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  indexer:
    image: "ghcr.io/midnight-ntwrk/indexer-standalone:4.4.0-pre-alpha.15-l91r3-n2r3-bridge-and-events-epics-blockhash-dust-f06af4b4"
    container_name: indexer_$TESTCONTAINERS_UID
    security_opt:
      - no-new-privileges:true
    ports:
      - "8088"
    environment:
      RUST_LOG: "indexer=debug,chain_indexer=debug,indexer_api=debug,wallet_indexer=debug,indexer_common=debug,fastrace_opentelemetry=off,info"
      APP__INFRA__NODE__URL: "ws://node:9944"
      APP__APPLICATION__NETWORK_ID: "undeployed"
      # kics-scan ignore-line
      APP__INFRA__STORAGE__PASSWORD: ${INDEXER_STORAGE_PASSWORD:?INDEXER_STORAGE_PASSWORD must be set}
      # kics-scan ignore-line
      APP__INFRA__PUB_SUB__PASSWORD: ${INDEXER_PUB_SUB_PASSWORD:?INDEXER_PUB_SUB_PASSWORD must be set}
      # kics-scan ignore-line
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: ${INDEXER_LEDGER_STATE_PASSWORD:?INDEXER_LEDGER_STATE_PASSWORD must be set}
      APP__INFRA__SECRET: ${INDEXER_SECRET:?INDEXER_SECRET must be set}
      APP__INFRA__SPO_NODE__URL: "ws://node:9944"
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: "e2e-test-dummy"

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/ready"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 60s
    depends_on:
      node:
        condition: service_healthy
  node:
    image: "ghcr.io/midnight-ntwrk/midnight-node:2.0.0-rc.3"
    container_name: node_$TESTCONTAINERS_UID
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    ports:
      - "127.0.0.1::9944"
    volumes:
      - node-data:/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          curl -fs -H 'Content-Type: application/json' -d
          '{"id":1,"jsonrpc":"2.0","method":"chain_getBlockHash","params":[1]}' http://localhost:9944 | grep -q
          '"result":"0x'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    environment:
      CFG_PRESET: "dev"
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"

  db:
    image: postgres:15
    container_name: db_$TESTCONTAINERS_UID
    ports:
      - "5432"
    environment:
      POSTGRES_USER: faucet
      POSTGRES_PASSWORD: mysecretpassword # checkov:skip=CKV_SECRET_6 local test database, not a real credential
      POSTGRES_DB: faucet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faucet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  faucet:
    build:
      context: ..
      dockerfile: ./Dockerfile
    container_name: faucet_$TESTCONTAINERS_UID
    ports:
      - "5300"
    environment:
      NODE_URL: "ws://node:9944"
      INDEXER_URL: "http://indexer:8088/api/v4/graphql"
      PROVING_SERVER_URL: "http://proof-server:6300"
      DB_HOST: "db"
      PRINT_CONFIG: "true"
      MAX_CONCURRENT_TASKS: 1
      THIRD_PARTY_ALLOWED_ORIGINS: "http://localhost:5300"
      THIRD_PARTY_API_KEY: "test-api-key-12345" # checkov:skip=CKV_SECRET_6 local test fixture, not a real credential
      JWT_SIGN_SECRET: ${JWT_SIGN_SECRET:?JWT_SIGN_SECRET must be set}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5300/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      node:
        condition: service_started
      indexer:
        condition: service_started
      proof-server:
        condition: service_started

volumes:
  node-data:
